<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>故事柑仔店島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="故事柑仔店的互動島嶼：九個貨架分區、五位語巫與一間會移動的柑仔店。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：整頁是島（3D），右側（手機為底部）是一張柑仔店的貨架標籤卡 */
:root {
  --dusk: #1c1830;      /* 夜色底 */
  --paper: #fbf1dc;     /* 標籤紙 */
  --ink: #2a2118;       /* 墨色字 */
  --muted: #7a6a58;     /* 次要字 */
  --orange: #f29a3e;    /* 柑仔色 */
  --red: #c8433a;       /* 招牌紅 */
  --gold: #ffc93c;      /* 語巫外框 */
  --line: #e4d3b2;
  --display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
  --body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--dusk); color: var(--paper); font-family: var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; touch-action: none; }
.labels { position: absolute; inset: 0; z-index: 1; } /* 名牌自己排前後，但整層在頂列與卡片下面 */

/* 頂列 */
.bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 7; /* 比卡片高：氛圍、搜尋的下拉才不會被卡片蓋住 */
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.45); }
.brand a { color: inherit; text-decoration: none; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: .06em; }
.brand p { margin: 0; font-size: 13px; opacity: .85; letter-spacing: .08em; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.overview { display: flex; align-items: center; gap: 6px; font: 700 13px var(--body); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.overview:hover { background: var(--orange); }
.overview:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.daybox { display: flex; background: rgba(20,16,32,.55); border: 1px solid rgba(255,240,210,.25); border-radius: 999px; padding: 3px; backdrop-filter: blur(6px); }
.daybox button { font: 500 13px var(--body); color: var(--paper); background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.daybox button[aria-pressed="true"] { background: var(--orange); color: var(--ink); }

/* 底部：分區快捷 */
.zonebar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.zonebar .scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 4px; }
.zonebar .scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 500 13px var(--body); color: var(--paper); background: rgba(20,16,32,.6); border: 1px solid rgba(255,240,210,.25); border-radius: 999px; padding: 7px 13px; cursor: pointer; backdrop-filter: blur(6px); white-space: nowrap; }
.chip:hover { border-color: var(--orange); }
.chip.shop { background: var(--red); border-color: var(--red); }
.chip.sub { font-size: 12px; padding: 6px 11px; border-style: dashed; }
.zone-tag.sub { font-size: 12px; padding: 2px 7px 3px; box-shadow: 0 2px 0 var(--ink); background: #fff7e6; }
.chip .where { opacity: .8; font-size: 12px; margin-left: 4px; }

/* 島上標籤 */
.zone-tag { font: 700 14px var(--display); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 9px 4px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; box-shadow: 0 3px 0 var(--ink); pointer-events: auto; letter-spacing: .04em; }
.zone-tag small { font: 500 11px var(--body); color: var(--muted); }
.zone-tag:hover { background: #fff7e6; }
.agent-tag { pointer-events: auto; cursor: pointer; font: 700 12px var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 999px; padding: 2px 9px 3px; display: flex; gap: 4px; align-items: baseline; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.agent-tag small { font-weight: 500; font-size: 10px; opacity: .7; }
.agent-tag.shop { background: var(--red); color: #fff3d6; font: 700 13px var(--display); padding: 3px 11px; }
.agent-tag.resident { background: var(--paper); box-shadow: 0 0 0 2px var(--oc, var(--orange)), 0 2px 6px rgba(0,0,0,.35); }
.bld-tag { pointer-events: auto; cursor: pointer; font: 700 12px var(--display); color: #fff3d6; background: rgba(29,20,24,.86); border: 1px solid var(--gold); border-radius: 4px; padding: 2px 8px 3px; letter-spacing: .04em; white-space: nowrap; }
.bld-tag:hover { background: var(--red); }
.bld-tag.tier2, .bld-tag.tier3 { font: 500 11px var(--body); padding: 1px 6px 2px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; border-color: rgba(255,201,60,.5); }
.bld-tag.tier3 { background: rgba(60,40,20,.82); }
.subs { display: grid; gap: 10px; }
.subs h4 { margin: 0 0 6px; font: 700 12px var(--body); color: var(--ink); display: flex; gap: 6px; align-items: baseline; }
.subs h4 small { color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips button { font: 500 12px var(--body); border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 4px; padding: 3px 7px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips button:hover { border-color: var(--red); color: var(--red); }
.blds { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.blds button { text-align: left; font: 500 13px var(--body); border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 7px 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.blds button small { color: var(--muted); font-variant-numeric: tabular-nums; }
.blds button:hover { border-color: var(--red); }
/* 島名招牌：恆亮的雙層燈管邊框，慢慢呼吸明暗；下緣一條小字燈管寫篇數 */
.zone-sign {
  --nc: #fff0c8;
  pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 14px 5px; border-radius: 9px;
  background: rgba(12, 8, 22, .72);
  border: 2px solid var(--nc);
  outline: 2px solid color-mix(in srgb, var(--nc) 55%, transparent); outline-offset: 3px;
  box-shadow: 0 0 8px var(--nc), 0 0 18px color-mix(in srgb, var(--nc) 50%, transparent), inset 0 0 8px color-mix(in srgb, var(--nc) 40%, transparent);
  color: #fffaf0;
  animation: sign-breathe 4.5s ease-in-out infinite;
}
.zone-sign b { font: 700 17px var(--display); letter-spacing: .1em; text-shadow: 0 0 3px var(--nc), 0 0 10px var(--nc), 0 0 18px var(--nc); }
.zone-sign small { font: 600 10px var(--body); letter-spacing: .14em; color: color-mix(in srgb, var(--nc) 75%, #fff); text-shadow: 0 0 6px var(--nc); }
.zone-sign:hover { background: rgba(12, 8, 22, .9); }
.zone-sign.sub { padding: 3px 10px 3px; outline: none; border-width: 1.5px; animation-duration: 6s; }
.zone-sign.sub b { font-size: 13px; }
.zone-sign.sub small { font-size: 9px; }
@keyframes sign-breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

/* 標題霓虹：柑仔店招牌的暖橘紅燈管，「店」字像接觸不良，偶爾自己閃一下 */
.neon-title {
  display: inline-block; margin: 0; padding: 4px 16px 6px; border-radius: 10px;
  font: 700 clamp(22px, 3.4vw, 32px) var(--display); letter-spacing: .14em; color: #fff4e6;
  background: rgba(12, 8, 22, .62); border: 2px solid #ff7a4a; outline: 2px solid rgba(255, 122, 74, .45); outline-offset: 3px;
  text-shadow: 0 0 3px #ff7a4a, 0 0 10px #ff6a3a, 0 0 22px #ff5a2a;
  box-shadow: 0 0 10px rgba(255, 106, 58, .8), 0 0 26px rgba(255, 90, 42, .45), inset 0 0 10px rgba(255, 106, 58, .4);
}
.neon-title .flick { animation: bad-tube 7s linear infinite; }
@keyframes bad-tube {
  0%, 82%, 100% { opacity: 1; text-shadow: inherit; }
  84% { opacity: .25; text-shadow: none; } 86% { opacity: 1; } 88% { opacity: .35; text-shadow: none; } 91% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .neon-title .flick, .zone-sign { animation: none; } }

/* 霓虹招牌：建築上方亮起的故事篇名。--nc 是各區的霓虹色 */
.neon {
  --nc: #fff0c8;
  pointer-events: auto; cursor: pointer; white-space: nowrap;
  font: 700 15px var(--display); letter-spacing: .06em; color: #fffaf0;
  padding: 4px 11px 5px; border: 2px solid var(--nc); border-radius: 7px;
  background: rgba(12, 8, 22, .58);
  text-shadow: 0 0 3px var(--nc), 0 0 9px var(--nc), 0 0 16px var(--nc);
  box-shadow: 0 0 6px var(--nc), 0 0 14px color-mix(in srgb, var(--nc) 55%, transparent), inset 0 0 6px color-mix(in srgb, var(--nc) 45%, transparent);
  opacity: 0;
}
.neon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 10px; margin-left: -1px; background: color-mix(in srgb, var(--nc) 70%, transparent); }
.neon.on { animation: neon-flicker 3.8s linear forwards; }
.neon:hover { background: rgba(12, 8, 22, .82); }
/* 像霓虹燈剛通電：啪、啪閃兩下才穩定，最後慢慢熄（一秒內最多閃兩下） */
@keyframes neon-flicker {
  0% { opacity: 0; } 5% { opacity: 1; } 9% { opacity: .2; } 14% { opacity: 1; } 18% { opacity: .35; } 24% { opacity: 1; }
  82% { opacity: 1; } 100% { opacity: 0; }
}
@keyframes neon-fade { 0% { opacity: 0; } 12% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .neon.on { animation-name: neon-fade; } }

/* 第一次進來的小說明卡 */
#guide { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(12, 8, 22, .45); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.guide-card { width: min(360px, 100%); background: var(--paper); color: var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.guide-card::before { content: ""; display: block; height: 8px; background: repeating-linear-gradient(90deg, var(--red) 0 18px, var(--paper) 18px 36px); }
.guide-body { padding: 18px 20px 20px; display: grid; gap: 12px; }
.guide-body h2 { margin: 0; font: 700 24px var(--display); letter-spacing: .06em; }
.guide-body ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.guide-body li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font-size: 14px; line-height: 1.65; color: #4a3d30; }
.guide-body li .ic { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font: 700 13px var(--display); }
.ic.neon-ic { color: #fffaf0; background: #1d1830; border: 2px solid #ff7ab8; text-shadow: 0 0 4px #ff7ab8; }
.ic.house-ic { background: #f2e2bf; color: var(--red); }
.ic.hand-ic { background: #e4e8f0; color: #3d4f6e; }
.guide-body .btn { justify-self: end; }
.help { width: 34px; height: 34px; border-radius: 50%; font: 700 15px var(--display); color: var(--paper); background: rgba(20,16,32,.6); border: 1px solid rgba(255,240,210,.35); cursor: pointer; backdrop-filter: blur(6px); }
.help:hover { border-color: var(--orange); }
.bubble { font: 500 12px var(--body); color: var(--ink); background: #fff; border-radius: 10px; padding: 5px 10px; max-width: 180px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.3); position: relative; pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
.zone-tag:focus-visible, .agent-tag:focus-visible, .chip:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* 貨架標籤卡 */
#panel {
  position: absolute; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 76px); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
  width: min(380px, calc(100% - 32px)); display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink); border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45);
  overflow: hidden;
}
#panel::before { content: ""; height: 8px; flex: none; background: repeating-linear-gradient(90deg, var(--red) 0 18px, var(--paper) 18px 36px); }
.p-head { padding: 16px 18px 12px; border-bottom: 1px dashed var(--line); display: grid; gap: 6px; position: relative; }
.p-kicker { font-size: 11px; letter-spacing: .18em; color: var(--red); font-weight: 700; }
.p-head h2 { margin: 0; font: 700 26px/1.2 var(--display); letter-spacing: .04em; text-wrap: balance; padding-right: 36px; }
.p-head p { margin: 0; font-size: 14px; line-height: 1.7; color: #4a3d30; }
.p-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff8ea; color: var(--ink); font-size: 18px; cursor: pointer; line-height: 1; }
.p-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.p-meta b { color: var(--ink); }
.p-body { overflow-y: auto; padding: 12px 18px 18px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.p-sec h3 { margin: 0 0 8px; font: 700 13px var(--body); letter-spacing: .12em; color: var(--muted); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.people button { font: 500 13px var(--body); border: 1.5px solid var(--gold); background: #fff6d6; color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.people .none { font-size: 13px; color: var(--muted); }
.series { display: flex; flex-wrap: wrap; gap: 6px; }
.series button { font: 500 12px var(--body); border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
.series button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search { width: 100%; box-sizing: border-box; font: 14px var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 2px; border-bottom: 1px dotted var(--line); color: var(--ink); text-decoration: none; }
.list li a:hover .t { color: var(--red); }
.list .t { font-size: 14px; line-height: 1.5; min-width: 0; }
.list .d { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
.list .g { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.more { font: 500 13px var(--body); background: none; border: 1px dashed var(--muted); color: var(--ink); border-radius: 6px; padding: 7px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 700 14px var(--body); text-decoration: none; border-radius: 6px; padding: 9px 14px; cursor: pointer; border: 2px solid var(--ink); background: var(--orange); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn.ghost { background: #fff8ea; }
.draw { border: 2px dashed var(--orange); border-radius: 8px; padding: 12px; background: #fff8ea; display: grid; gap: 6px; }
.draw b { font: 700 17px var(--display); }
.draw p { margin: 0; font-size: 13px; line-height: 1.7; color: #4a3d30; }
.draw a { color: var(--red); font-weight: 700; font-size: 13px; }

#hint { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); font-size: 12px; color: var(--paper); opacity: .75; white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
#loading { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--dusk); font: 700 20px var(--display); letter-spacing: .1em; transition: opacity .6s; }
#loading.done { opacity: 0; pointer-events: none; }

/* 全島搜尋 */
.finder { position: relative; flex: 0 1 300px; margin-left: auto; }
.finder input { width: 100%; box-sizing: border-box; font: 500 14px var(--body); color: var(--paper); background: rgba(20,16,32,.62); border: 1px solid rgba(255,240,210,.3); border-radius: 999px; padding: 8px 14px 8px 34px; backdrop-filter: blur(6px); }
.finder input::placeholder { color: rgba(251,241,220,.6); }
.finder input:focus { outline: none; border-color: var(--orange); }
.find-ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(251,241,220,.7); pointer-events: none; }
.find-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 6px; list-style: none; background: var(--paper); color: var(--ink); border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.45); max-height: min(60vh, 420px); overflow-y: auto; z-index: 10; }
.find-list li { display: grid; gap: 1px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.find-list li[aria-selected="true"], .find-list li:hover { background: #f3e4c4; }
.find-list .ft { font-size: 14px; line-height: 1.45; }
.find-list .ft mark { background: rgba(242,154,62,.35); color: inherit; border-radius: 2px; }
.find-list .fs { font-size: 11px; color: var(--muted); }
.find-list .empty { color: var(--muted); font-size: 13px; cursor: default; }
/* 氛圍按鈕與彈出選單 */
.mood { position: relative; }
.mood-btn { display: flex; align-items: center; gap: 6px; font: 600 13px var(--body); color: var(--paper); background: rgba(20,16,32,.6); border: 1px solid rgba(255,240,210,.3); border-radius: 999px; padding: 7px 13px; cursor: pointer; backdrop-filter: blur(6px); }
.mood-btn[aria-expanded="true"], .mood-btn:hover { border-color: var(--orange); }
.mood-pop { position: absolute; right: 0; top: calc(100% + 8px); display: grid; gap: 10px; padding: 12px; background: rgba(20,16,32,.88); border: 1px solid rgba(255,240,210,.25); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.4); backdrop-filter: blur(8px); z-index: 10; }
.mood-row { display: grid; gap: 6px; }
.mood-row > span { font: 600 11px var(--body); letter-spacing: .12em; color: rgba(251,241,220,.65); }
.mood-pop .daybox { background: rgba(255,255,255,.06); }
.mood-pop { width: max-content; }
.mood-pop .daybox button { white-space: nowrap; }
/* 聲音按鈕：關著是斜線喇叭，開著聲波會亮 */
.snd { display: grid; place-items: center; padding: 0; }
.snd .on-ic { display: none; }
.snd[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }
.snd[aria-pressed="true"] .on-ic { display: block; }
.snd[aria-pressed="true"] .off-ic { display: none; }
.vol { display: flex; align-items: center; gap: 8px; color: var(--paper); font: 600 12px var(--body); }
.vol input { flex: 1; accent-color: var(--orange); }
/* 故事目錄：六座島依序排，每座可以展開看地標 */
.idx { list-style: none; margin: 0; padding: 0; display: grid; }
.idx > li { border-bottom: 1px solid var(--line); }
.idx-row { width: 100%; display: grid; grid-template-columns: 46px 1fr auto auto; align-items: center; gap: 8px; padding: 12px 2px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--ink); }
.idx-row:hover .idx-name { color: var(--red); }
.idx-no { font: 700 24px var(--display); font-style: italic; color: var(--nc); text-shadow: 0 0 1px rgba(0,0,0,.25); }
.idx-name { font: 700 16px var(--display); letter-spacing: .04em; }
.idx-n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.idx-tog { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer; font-size: 12px; }
.idx-tog[aria-expanded="true"] { transform: rotate(180deg); }
.idx-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; padding: 0 0 12px 54px; }
.idx-sub button { text-align: left; font: 500 13px var(--body); color: #4a3d30; background: none; border: 0; padding: 3px 0; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.idx-sub button:hover { color: var(--red); }
.idx-sub small { color: var(--muted); font-variant-numeric: tabular-nums; }
.idx-foot { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; }
.chip.idx-chip { background: var(--paper); color: var(--ink); border-color: var(--paper); }

/* 卡片裡可收合的區塊 */
.p-fold { border-top: 1px dashed var(--line); padding-top: 10px; }
.p-fold > summary { cursor: pointer; list-style: none; font: 700 13px var(--body); letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.p-fold > summary::-webkit-details-marker { display: none; }
.p-fold > summary::after { content: "展開 ▾"; font-weight: 500; letter-spacing: 0; color: var(--red); font-size: 12px; }
.p-fold[open] > summary::after { content: "收起 ▴"; }
.p-fold[open] > summary { margin-bottom: 8px; }
.picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.picks a { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-decoration: none; }
.picks a:hover { border-color: var(--red); }
.picks .tag { font: 700 10px var(--body); letter-spacing: .1em; color: #fff; background: var(--red); border-radius: 3px; padding: 2px 5px; }
.picks .tag.rand { background: var(--orange); color: var(--ink); }
.picks .t { font-size: 14px; line-height: 1.5; }
.picks .g { grid-column: 2; font-size: 11px; color: var(--muted); }

/* 手機：頂列只留標題、俯瞰小圖示、兩個下拉選單；卡片改成底部抽屜 */
@media (max-width: 720px) {
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .brand .neon-title { font-size: 18px; padding: 3px 10px 4px; letter-spacing: .1em; }
  .zone-sign { padding: 4px 9px 3px; outline-offset: 2px; }
  .zone-sign b { font-size: 13px; }
  .zone-sign small { font-size: 9px; }
  .zone-sign.sub b { font-size: 11px; }
  .brand p { display: none; }
  .tools { display: contents; }
  .bar { grid-template-columns: 1fr auto auto auto auto; gap: 8px 6px; }
  .help { grid-column: 2; grid-row: 1; }
  .help.snd { grid-column: 3; }
  .overview { grid-column: 4; grid-row: 1; padding: 7px 9px; }
  .mood { grid-column: 5; grid-row: 1; }
  .mood-btn { padding: 8px 9px; }
  .mood-text { display: none; }
  .finder { grid-column: 1 / -1; grid-row: 2; margin-left: 0; }
  .finder input { font-size: 16px; padding: 7px 12px 7px 32px; } /* 16px 以上，iPhone 點進去才不會自動放大 */
  .daybox button { padding: 6px 9px; }
  .neon { font-size: 12px; padding: 3px 8px 4px; }
  .ov-text { display: none; }
  #panel { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); max-height: 52%; }
  .p-head { padding: 12px 14px 10px; }
  .p-head h2 { font-size: 21px; }
  .p-head p { font-size: 13px; line-height: 1.6; }
  .p-body { padding: 10px 14px 14px; }
  .blds { grid-template-columns: 1fr 1fr; }
  .zone-tag { font-size: 12px; padding: 2px 7px 3px; }
  .zone-tag small { font-size: 10px; }
  .zone-tag.sub { font-size: 11px; }
  .agent-tag { font-size: 10px; padding: 1px 7px 2px; }
  .agent-tag small { display: none; }
  .bubble { font-size: 11px; max-width: 140px; }
  .chip { font-size: 12px; padding: 6px 11px; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { #loading { transition: none; } }

<script type="module">
import { start } from "./island.js";
import { BASE } from "./island-config.js";

const $ = (s, el = document) => el.querySelector(s);
const panel = $("#panel");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const link = (u) => BASE + u;
let shopZone = null;

function head(kicker, title, text, meta = "") {
  return `<div class="p-head"><span class="p-kicker">${esc(kicker)}</span><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}${meta}
    <button class="p-close" type="button" aria-label="關閉">×</button></div>`;
}
function open(html) {
  autoIndexOn = false;
  panel.innerHTML = html;
  panel.hidden = false;
  panel.dataset.index = "";
  panel.scrollTop = 0;
  ui.panelOpen = true;
  $(".p-close", panel).onclick = close;
}
// 電腦版：關掉卡片時回到故事目錄（除非使用者自己把目錄也關了）；手機版直接收起來
let indexDismissed = false;
let autoIndexOn = true; // 開場自動打開目錄（只做一次）
const isWide = () => innerWidth > 720;
function close() {
  ui.api?.closed();
  if (isWide() && !indexDismissed && !panel.dataset.index) return showIndex();
  panel.hidden = true;
  panel.dataset.index = "";
  ui.panelOpen = false;
}
// 故事目錄
function showIndex() {
  if (!ui.api) return;
  indexDismissed = false;
  const zs = ui.api.zones;
  const total = new Set(zs.flatMap((z) => z.posts.map((p) => p.id))).size;
  open(head("故事目錄", "故事柑仔店島", `${zs.length} 座島，${total} 個故事瓶。點一座島走進去，或點右邊的箭頭看島上有什麼。`) +
    `<div class="p-body"><ul class="idx" id="idx"></ul>
      <p class="idx-foot">找不到想看的？試試頂列的「找故事」，或在海上撿一個發光的漂流瓶。</p></div>`);
  panel.dataset.index = "1";
  const ul = $("#idx", panel);
  zs.forEach((z, i) => {
    const li = document.createElement("li");
    const marks = z.buildings.filter((b) => b.tier === 1).sort((a, b) => (a.step || 99) - (b.step || 99));
    const parts = [...(z.sectors || []), ...(z.towers || [])];
    li.innerHTML = `<div style="display:flex;align-items:center">
        <button class="idx-row" type="button" style="--nc:${z.id === "laoban" ? "#c9a050" : ui.api.neon[z.id] || "#c8433a"}">
          <span class="idx-no">${String(i + 1).padStart(2, "0")}</span><span class="idx-name">${esc(z.name)}</span><span class="idx-n">${z.posts.length} 篇</span></button>
        <button class="idx-tog" type="button" aria-expanded="false" aria-label="展開${esc(z.name)}的地標">▾</button></div>
      <div class="idx-sub" hidden></div>`;
    li.querySelector(".idx-row").onclick = () => ui.api.openZone(z.id);
    const tog = li.querySelector(".idx-tog"), sub = li.querySelector(".idx-sub");
    tog.onclick = () => {
      const on = sub.hidden;
      sub.hidden = !on;
      tog.setAttribute("aria-expanded", String(on));
      if (on && !sub.childElementCount) {
        parts.forEach((s) => {
          const b = document.createElement("button");
          b.type = "button";
          b.innerHTML = `<span>▸ ${esc(s.name)}</span><small>${z.posts.filter((p) => (p.cats || [p.cat]).includes(s.cat)).length}</small>`;
          b.onclick = () => ui.api.openSector(z.id, s.id);
          sub.append(b);
        });
        marks.forEach((bd) => {
          const b = document.createElement("button");
          b.type = "button";
          b.innerHTML = `<span>${esc(bd.label || bd.name)}</span><small>${bd.posts.length}</small>`;
          b.onclick = () => ui.api.openBuilding(bd);
          sub.append(b);
        });
      }
    };
    ul.append(li);
  });
  $(".p-close", panel).onclick = () => { indexDismissed = true; close(); };
}
function storyList(container, posts) {
  const ul = document.createElement("ul");
  ul.className = "list";
  let shown = 0;
  const more = document.createElement("button");
  more.className = "more";
  more.type = "button";
  const render = () => {
    const next = posts.slice(shown, shown + 40);
    ul.insertAdjacentHTML("beforeend", next.map((p) => `<li><a href="${link(p.u)}" target="_blank" rel="noopener">
      <span class="t">${esc(p.t)}</span><span class="d">${esc(p.d)}</span>${p.g ? `<span class="g">${esc(p.g)}</span>` : ""}</a></li>`).join(""));
    shown += next.length;
    more.hidden = shown >= posts.length;
    more.textContent = `再看 ${Math.min(40, posts.length - shown)} 瓶`;
  };
  render();
  container.replaceChildren(ul, more);
  more.onclick = render;
  if (!posts.length) container.innerHTML = `<p class="none" style="margin:0;font-size:13px;color:var(--muted)">沒有符合的故事。</p>`;
}

const ui = {
  api: null,
  onDayMode: null,
  setNight(u) { document.documentElement.style.setProperty("--night", u.toFixed(2)); },
  shopMoved(zone) {
    shopZone = zone;
    const where = $("#shop-where");
    if (where) where.textContent = `停在${zone.name}`;
    const live = $("[data-shop-live]", panel);
    if (live && !panel.hidden) live.textContent = zone.name;
  },
  showZone(z, here, { open: openAgent, openBuilding }) {
    open(head(z.parent ? `${z.parent}・區塊` : z.main ? `貨架分區・總建築 ${z.main.name}` : "貨架分區", z.name, z.main ? `${z.tagline}。${z.main.desc}` : z.tagline,
      `<div class="p-meta"><span><b>${z.posts.length}</b> 瓶故事</span><a href="${link(z.page)}" target="_blank" rel="noopener" style="color:var(--red)">到這一區的貨架 ↗</a></div>`) +
      `<div class="p-body">
        <section class="p-sec"><h3>先讀這幾篇</h3><ul class="picks" id="picks"></ul></section>
        ${z.sectors ? `<section class="p-sec"><h3>區塊</h3><div class="blds" id="secs"></div></section>` : ""}
        <section class="p-sec" id="allSec"><h3>全部 ${z.posts.length} 篇故事</h3>
          <input class="search" id="q" type="search" placeholder="在這一區找故事" aria-label="在這一區找故事">
          <div class="series" id="series" style="margin-top:8px"></div>
          <div id="stories" style="margin-top:6px"></div></section>
        ${z.buildings?.length ? `<details class="p-fold" id="bldsSec"><summary>${z.layout?.plan === "spiral" ? "地府旅程・依序走" : "這一區的地標"}</summary><div class="blds" id="blds"></div></details>
        <details class="p-fold" id="subsSec"><summary>街坊與路標</summary><div class="subs" id="subs"></div></details>` : ""}
        <details class="p-fold"><summary>現在在這一區</summary><div class="people" id="here"></div></details>
      </div>`);
    // 先讀這幾篇：最新一篇＋兩篇隨機，點了直接去讀
    const pool = z.posts.slice(1);
    const picks = [z.posts[0], ...pool.sort(() => Math.random() - 0.5).slice(0, 2)].filter(Boolean);
    $("#picks", panel).innerHTML = picks.map((p, i) => `<li><a href="${link(p.u)}" target="_blank" rel="noopener">
      <span class="tag ${i ? "rand" : ""}">${i ? "隨機" : "最新"}</span><span class="t">${esc(p.t)}</span>${p.g ? `<span class="g">${esc(p.g)}</span>` : ""}</a></li>`).join("")
      || `<li class="none" style="font-size:13px;color:var(--muted)">這一區還沒有故事。</li>`;
    // 合併區：每個區塊一顆按鈕，點了飛過去並只看那一塊
    [...(z.sectors || []), ...(z.towers || [])].forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span>${esc(s.name)}</span><small>${z.posts.filter((p) => (p.cats || [p.cat]).includes(s.cat)).length}</small>`;
      b.onclick = () => ui.api.openSector(z.id, s.id);
      $("#secs", panel).append(b);
    });
    const blds = z.buildings || [];
    blds.filter((bd) => bd.tier === 1).sort((a, b) => (a.step || 99) - (b.step || 99)).forEach((bd) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span>${esc(bd.label || bd.name)}</span><small>${bd.posts.length}</small>`;
      b.onclick = () => openBuilding(bd);
      $("#blds", panel).append(b);
    });
    const streets = new Map(); // 系列街坊與路標，依系列分組
    blds.filter((bd) => bd.tier > 1).forEach((bd) => (streets.get(bd.series) || streets.set(bd.series, []).get(bd.series)).push(bd));
    if (!streets.size && $("#subsSec", panel)) $("#subsSec", panel).hidden = true;
    for (const [name, list] of streets) {
      const box = document.createElement("div");
      box.innerHTML = `<h4>${esc(name)}<small>${list.length} 篇</small></h4><div class="chips"></div>`;
      list.forEach((bd) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = bd.name;
        b.title = bd.name;
        b.onclick = () => openBuilding(bd);
        box.lastChild.append(b);
      });
      $("#subs", panel).append(box);
    }
    const hereEl = $("#here", panel);
    if (here.length) here.forEach((a) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = a.kind === "shop" ? "故事柑仔店（本店）" : `${a.def.role || a.def.type}・${a.def.name}`;
      if (a.kind === "resident") b.style.borderColor = "var(--line)";
      b.onclick = () => openAgent(a);
      hereEl.append(b);
    });
    else hereEl.innerHTML = `<span class="none">目前沒人經過，等一下再來看看。</span>`;

    const counts = {};
    z.posts.forEach((p) => p.g && (counts[p.g] = (counts[p.g] || 0) + 1));
    let series = null;
    const seriesEl = $("#series", panel);
    const names = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    if (!names.length) seriesEl.hidden = true;
    // 收合區塊的標題後面標上數量，讓人知道裡面有多少
    const bldCount = blds.filter((bd) => bd.tier === 1).length;
    if ($("#bldsSec", panel)) $("#bldsSec summary", panel).insertAdjacentHTML("beforeend", ` <small style="font-weight:500;letter-spacing:0">（${bldCount}）</small>`);
    if ($("#subsSec", panel) && streets.size) $("#subsSec summary", panel).insertAdjacentHTML("beforeend", ` <small style="font-weight:500;letter-spacing:0">（${blds.filter((bd) => bd.tier > 1).length}）</small>`);
    const draw = () => {
      const q = $("#q", panel).value.trim();
      storyList($("#stories", panel), z.posts.filter((p) => (!series || p.g === series) && (!q || (p.t + (p.ex || "")).includes(q))));
    };
    names.forEach(([n, c]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `${n.replace("系列", "")} ${c}`;
      b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        series = series === n ? null : n;
        seriesEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b && series === n)));
        draw();
      };
      seriesEl.append(b);
    });
    $("#q", panel).oninput = draw;
    draw();
  },
  showAgent(def, zone, posts, kind, homeB, { openBuilding }) {
    open(head(kind === "wizard" ? `語巫・${def.role}` : `居民・${def.type || ""}`, def.name, def.desc,
      `<div class="p-meta"><span>現在在 <b>${esc(zone.name)}</b></span>${homeB ? `<span>住在 <b>${esc(homeB.name)}</b></span>` : ""}<span>出場 <b>${posts.length}</b> 瓶</span></div>`) +
      `<div class="p-body">
        <div class="actions">
          ${def.page ? `<a class="btn" href="${link(def.page)}" target="_blank" rel="noopener">讀${esc(def.name)}的故事 ↗</a>` : ""}
          ${homeB ? `<button class="btn ghost" type="button" id="goHome">去他住的${esc(homeB.name)}</button>` : ""}
        </div>
        <section class="p-sec"><h3>出場的故事</h3><div id="stories"></div></section>
      </div>`);
    if (homeB) $("#goHome", panel).onclick = () => openBuilding(homeB);
    storyList($("#stories", panel), posts);
  },
  // 點霓虹招牌：只看這一篇，下面可以再看整棟
  showPost(p, b, zone, { openBuilding, kicker }) {
    const ex = (p.ex || "").trim();
    open(head(kicker || `${zone.name}・${b.series || b.name}`, p.t, "",
      `<div class="p-meta"><span>${esc(p.d || "")}</span>${p.g ? `<span>${esc(p.g)}</span>` : ""}</div>`) +
      `<div class="p-body">
        ${ex ? `<p style="margin:0;font-size:14px;line-height:1.8;color:#4a3d30">${esc(ex.slice(0, 140))}${ex.length > 140 ? "……" : ""}</p>` : ""}
        <div class="actions"><a class="btn" href="${link(p.u)}" target="_blank" rel="noopener">讀這一篇 ↗</a>
        ${b.posts.length > 1 ? `<button class="btn ghost" type="button" id="wholeB">看${esc(b.name.length > 10 ? "這一棟" : b.name)}全部 ${b.posts.length} 篇</button>` : ""}</div>
      </div>`);
    const whole = $("#wholeB", panel);
    if (whole) whole.onclick = () => openBuilding(b);
  },
  showBuilding(b, zone, residents, { open: openAgent, openZone }) {
    open(head(`${zone.name}・${b.step ? `地府旅程第 ${b.step} 站` : b.series || "地標"}`, b.name, b.desc,
      `<div class="p-meta"><span><b>${b.posts.length}</b> 瓶故事</span><span>住了 <b>${residents.length}</b> 位</span></div>`) +
      `<div class="p-body">
        ${b.posts[0] ? `<div class="actions"><a class="btn" href="${link(b.posts[0].u)}" target="_blank" rel="noopener">讀〈${esc(b.posts[0].t)}〉↗</a><button class="btn ghost" type="button" id="allZone">看${esc(zone.name)}全部</button></div>` : ""}
        ${residents.length ? `<section class="p-sec"><h3>住在這裡</h3><div class="people" id="res"></div></section>` : ""}
        <section class="p-sec"><h3>這裡的故事</h3><div id="stories"></div></section>
      </div>`);
    residents.forEach((a) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = `${a.def.type}・${a.def.name}`;
      btn.onclick = () => openAgent(a);
      $("#res", panel).append(btn);
    });
    const all = $("#allZone", panel);
    if (all) all.onclick = () => openZone(zone.id);
    storyList($("#stories", panel), b.posts);
  },
  showShop(def, zone, posts) {
    open(head("本店", def.name, def.desc,
      `<div class="p-meta"><span>今天停在 <b data-shop-live>${esc(zone.name)}</b></span><span>架上 <b>${posts.length}</b> 瓶故事</span></div>`) +
      `<div class="p-body">
        <div class="actions"><a class="btn" href="${link(def.page)}" target="_blank" rel="noopener">走進店裡 ↗</a><button class="btn ghost" type="button" id="drawBtn">抽一瓶</button></div>
        <div id="drawn"></div>
        <section class="p-sec"><h3>柑仔店會移動</h3><p style="margin:0;font-size:13px;line-height:1.7;color:#4a3d30">本店每過一陣子就沿著橋推到下一區，停一會兒再走。點下方的「故事柑仔店」可以隨時找到它。</p></section>
      </div>`);
    const drawOne = () => {
      const p = posts[Math.floor(Math.random() * posts.length)];
      $("#drawn", panel).innerHTML = `<div class="draw"><span class="p-kicker">${esc(p.cat)}</span><b>${esc(p.t)}</b><p>${esc((p.ex || "").slice(0, 90))}${(p.ex || "").length > 90 ? "……" : ""}</p><a href="${link(p.u)}" target="_blank" rel="noopener">讀這一瓶 ↗</a></div>`;
    };
    $("#drawBtn", panel).onclick = drawOne;
  },
};

document.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-day]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  ui.onDayMode?.(b.dataset.day);
}));
document.querySelectorAll("[data-weather]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-weather]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  ui.onWeather?.(b.dataset.weather);
}));
// 氛圍彈出選單：點按鈕開關，點外面或按 Esc 收起來
const moodBtn = $("#moodBtn"), moodPop = $("#moodPop");
const setMood = (on) => { moodPop.hidden = !on; moodBtn.setAttribute("aria-expanded", String(on)); };
moodBtn.onclick = (e) => { e.stopPropagation(); setMood(moodPop.hidden); };
document.addEventListener("pointerdown", (e) => { if (!moodPop.hidden && !e.target.closest(".mood")) setMood(false); });
addEventListener("keydown", (e) => e.key === "Escape" && !moodPop.hidden && setMood(false));

// ---- 全島搜尋：打篇名、系列或人物名，選一個就飛過去 ----
const findQ = $("#findQ"), findList = $("#findList");
let findHits = [], findSel = -1;
const markHit = (text, q) => {
  const i = text.indexOf(q);
  return i < 0 ? esc(text) : `${esc(text.slice(0, i))}<mark>${esc(q)}</mark>${esc(text.slice(i + q.length))}`;
};
function renderFind() {
  const q = findQ.value.trim();
  if (!q || !ui.api) { findList.hidden = true; findQ.setAttribute("aria-expanded", "false"); return; }
  findHits = ui.api.find(q);
  findSel = findHits.length ? 0 : -1;
  findList.innerHTML = findHits.length
    ? findHits.map((h, i) => `<li role="option" data-i="${i}" aria-selected="${i === findSel}"><span class="ft">${markHit(h.title, q)}</span><span class="fs">${esc(h.sub)}</span></li>`).join("")
    : `<li class="empty">找不到「${esc(q)}」，換個關鍵字試試。</li>`;
  findList.hidden = false;
  findQ.setAttribute("aria-expanded", "true");
}
function pickFind(i) {
  const h = findHits[i];
  if (!h) return;
  findList.hidden = true;
  findQ.setAttribute("aria-expanded", "false");
  findQ.blur();
  h.go();
}
findQ.addEventListener("input", renderFind);
findQ.addEventListener("focus", () => findQ.value.trim() && renderFind());
findQ.addEventListener("keydown", (e) => {
  if (findList.hidden || !findHits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    findSel = (findSel + (e.key === "ArrowDown" ? 1 : -1) + findHits.length) % findHits.length;
    findList.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", String(i === findSel)));
    findList.querySelector(`[data-i="${findSel}"]`)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); pickFind(findSel); }
  else if (e.key === "Escape") { findList.hidden = true; }
});
findList.addEventListener("pointerdown", (e) => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pickFind(+li.dataset.i); } });
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#finder")) findList.hidden = true; });
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !panel.hidden) close();
  if ((e.key === "h" || e.key === "H") && !e.target.closest?.("input")) goOverview();
});
function goOverview() {
  if (!panel.hidden) close();
  ui.api?.overview();
}
$("#overviewBtn").onclick = goOverview;

start({ stage: $("#stage"), ui }).then(() => {
  const chips = $("#chips");
  const idxChip = document.createElement("button");
  idxChip.className = "chip idx-chip";
  idxChip.type = "button";
  idxChip.textContent = "☰ 目錄";
  idxChip.onclick = showIndex;
  chips.append(idxChip);
  const shopChip = document.createElement("button");
  shopChip.className = "chip shop";
  shopChip.type = "button";
  shopChip.innerHTML = `故事柑仔店<span class="where" id="shop-where">${shopZone ? "停在" + esc(shopZone.name) : ""}</span>`;
  shopChip.onclick = () => ui.api.openShop();
  chips.append(shopChip);
  const all = document.createElement("button");
  all.className = "chip";
  all.type = "button";
  all.textContent = "全島";
  all.onclick = () => { close(); ui.api.overview(); };
  chips.append(all);
  const chip = (text, onclick, sub = false) => {
    const c = document.createElement("button");
    c.className = sub ? "chip sub" : "chip";
    c.type = "button";
    c.textContent = text;
    c.onclick = onclick;
    chips.append(c);
  };
  ui.api.zones.forEach((z) => {
    chip(z.name, () => ui.api.openZone(z.id));
    // 合併區後面接各區塊的按鈕，網站原本的分區都還找得到
    [...(z.sectors || []), ...(z.towers || [])].forEach((s) => chip(s.name, () => ui.api.openSector(z.id, s.id), true));
  });
  $("#loading").classList.add("done");
  setTimeout(() => ($("#loading").hidden = true), 900); // 淡出後整個拿掉，慢的手機也不會卡著一層
  // 電腦版：右側預設是故事目錄。頁面剛載入時可能還沒有寬度，等寬度出來再自動開一次；
  // 使用者自己打開過任何卡片之後就不再自動開
  const autoIndex = () => {
    if (!autoIndexOn) return removeEventListener("resize", autoIndex);
    if (isWide() && panel.hidden) { autoIndexOn = false; showIndex(); }
  };
  autoIndex();
  addEventListener("resize", autoIndex);
  // 第一次來才自動跳說明卡（記在這台裝置上；瀏覽器不讓記也沒關係，頂多每次都跳）
  let seen = false;
  try { seen = localStorage.getItem("story-island-guide") === "1"; } catch {}
  if (!seen) setTimeout(showGuide, 700);
}).catch((err) => {
  console.error(err);
  $("#loading").textContent = "島嶼載入失敗，請重新整理頁面。";
});

// 說明卡
function showGuide() {
  if (matchMedia("(hover: none)").matches) $("#guideHand").textContent = "一根手指拖曳轉動畫面，兩根手指縮放；右上角的小房子圖示隨時帶你回到高處。";
  $("#guide").hidden = false;
  $("#guideOk").focus();
}
function closeGuide() {
  $("#guide").hidden = true;
  try { localStorage.setItem("story-island-guide", "1"); } catch {}
}
$("#guideOk").onclick = closeGuide;
$("#guide").addEventListener("click", (e) => e.target.id === "guide" && closeGuide());
$("#helpBtn").onclick = showGuide;

// ---- 聲音：瀏覽器規定要使用者點過才能出聲。上次開著的話，這次第一次點畫面就接著播 ----
const soundBtn = $("#soundBtn"), volRange = $("#volRange");
let soundPref = { on: false, vol: 0.7 };
try { Object.assign(soundPref, JSON.parse(localStorage.getItem("story-island-sound") || "{}")); } catch {}
volRange.value = Math.round(soundPref.vol * 100);
const saveSound = () => { try { localStorage.setItem("story-island-sound", JSON.stringify(soundPref)); } catch {} };
function setSound(on) {
  const snd = ui.api?.sound;
  if (!snd) return;
  soundPref.on = on;
  snd.setVolume(soundPref.vol);
  snd.enable(on);
  soundBtn.setAttribute("aria-pressed", String(on));
  soundBtn.title = on ? "關掉聲音" : "打開島上的聲音";
  saveSound();
}
soundBtn.onclick = () => setSound(!soundPref.on);
volRange.oninput = () => {
  soundPref.vol = volRange.value / 100;
  ui.api?.sound.setVolume(soundPref.vol);
  if (!soundPref.on && soundPref.vol > 0) setSound(true); // 拉音量就當作要聽
  saveSound();
};
if (soundPref.on) {
  soundBtn.setAttribute("aria-pressed", "true");
  const resume = (e) => {
    removeEventListener("pointerdown", resume, true);
    removeEventListener("keydown", resume, true);
    if (e.target.closest?.("#soundBtn")) return; // 第一下就是按亮著的聲音鈕＝想關掉，交給按鈕自己切換
    if (soundPref.on && ui.api?.sound && !ui.api.sound.on) setSound(true);
  };
  addEventListener("pointerdown", resume, true);
  addEventListener("keydown", resume, true);
}
addEventListener("keydown", (e) => e.key === "Escape" && !$("#guide").hidden && closeGuide());
</script>
